name: Deploy Website BĐS lên GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn & dữ liệu dự án
        uses: actions/checkout@v4

      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v5

      - name: Đóng gói toàn bộ Website & BDS Studio App
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Xuất bản trực tiếp lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
