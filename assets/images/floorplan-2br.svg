  <!-- Common Bath -->
  <rect x="210" y="195" width="120" height="100" fill="#E3ECE8" stroke="#0E3A2F" stroke-width="3"/>
  <text x="270" y="250" text-anchor="middle" fill="#0E3A2F" font-family="sans-serif" font-size="13" font-weight="700">WC CHUNG</text>

  <!-- Bedroom 2 -->
