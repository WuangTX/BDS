  <!-- Info Card on Right -->
  <rect x="760" y="60" width="290" height="560" rx="24" fill="#0E3A2F"/>
  <text x="795" y="120" fill="#E6C987" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="2">CĂN HỘ ĐIỂN HÌNH</text>
  <text x="795" y="162" fill="#FAF8F4" font-family="sans-serif" font-size="28" font-weight="700">2 Phòng Ngủ Deluxe</text>
  <line x1="795" y1="190" x2="1015" y2="190" stroke="#C8A45D" stroke-opacity="0.4"/>

  <text x="795" y="238" fill="#A6BDB4" font-family="sans-serif" font-size="14">Diện tích tim tường</text>
  <text x="795" y="268" fill="#FAF8F4" font-family="sans-serif" font-size="24" font-weight="700">82.5 m²</text>

  <text x="795" y="325" fill="#A6BDB4" font-family="sans-serif" font-size="14">Diện tích thông thủy</text>
