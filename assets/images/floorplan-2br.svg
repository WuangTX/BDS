<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" fill="none">
  <rect width="1100" height="680" rx="28" fill="#FAF8F4"/>
  <rect x="60" y="60" width="660" height="560" rx="24" fill="#FFFFFF" stroke="#0E3A2F" stroke-width="5"/>

  <!-- Curved Balcony -->
  <path d="M90 540 H690 V595 C690 606, 680 612, 668 612 H112 C100 612, 90 606, 90 595 Z" fill="#E3F0EA" stroke="#0E3A2F" stroke-width="2.5"/>
  <text x="390" y="583" text-anchor="middle" fill="#0E3A2F" font-family="sans-serif" font-size="15" font-weight="700">BAN CÔNG KÍNH CONG PANORAMA (10.2 m²)</text>

  <!-- Living + Dining -->
  <rect x="330" y="210" width="360" height="330" fill="#F9F5EC" stroke="#0E3A2F" stroke-width="3"/>
