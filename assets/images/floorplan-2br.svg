  <text x="210" y="440" text-anchor="middle" fill="#6F7D75" font-family="sans-serif" font-size="14">18.6 m² • Cửa kính tràn viền</text>

  <!-- Master Bath -->
  <rect x="90" y="195" width="120" height="100" fill="#E3ECE8" stroke="#0E3A2F" stroke-width="3"/>
