  <text x="795" y="440" fill="#FAF8F4" font-family="sans-serif" font-size="18" font-weight="600">Đông Nam — View sông &amp; Hồ bơi</text>

  <text x="795" y="498" fill="#A6BDB4" font-family="sans-serif" font-size="14">Tiêu chuẩn bàn giao</text>
  <text x="795" y="526" fill="#E6C987" font-family="sans-serif" font-size="17" font-weight="600">Nội thất liền tường Châu Âu</text>
